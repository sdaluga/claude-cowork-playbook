# =============================================================================
# CI — keep the examples honest
# =============================================================================
# CI here does two jobs.
#
# First, make sure someone who clones this on a Tuesday can actually run it:
# syntax, types, and the container build are the three things that break first.
#
# Second, defend the claims. This repo asserts that certain lines are security
# controls -- an empty tool allow list, `settingSources: []`, a write guard, a
# concurrency bound. An assertion nothing enforces is a comment. So both
# examples ship tests that fail when a control is removed, and those run here.
#
# We deliberately do NOT run the agents in CI. They would need an API key and
# would spend money on every push. Agent behaviour is validated by running the
# examples, which is what the READMEs walk you through.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff

      # Syntax + import correctness across every example.
      - name: Compile
        run: python -m compileall -q examples/

      - name: Lint
        run: ruff check examples/ --select E9,F63,F7,F82,F401 --ignore E501

      # The defense tests. These are the reason the README's prompt-injection
      # claim is worth anything: they assert that the deterministic layers --
      # tool isolation, the write guard, and the system-of-record override --
      # hold regardless of what the model does. No API key, no model call.
      - name: Defense tests (example 02)
        working-directory: examples/02-document-pipeline-agent
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v

  typescript:
    name: TypeScript service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/03-inbox-triage-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependency cache here on purpose: this example ships without a
      # committed package-lock.json so readers always resolve current SDK
      # versions. setup-node's npm cache requires a lockfile, so enabling it
      # fails the job before install even runs.

      # NOTE: `npm install`, and in a real project with a lockfile, `npm ci`.
      # Never add --omit=optional to either: the TypeScript SDK ships its
      # bundled Claude Code binary through optional dependencies, and omitting
      # them produces a build that passes CI and fails at the first query().
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The control tests. Every assertion in tests/options.test.ts pins down a
      # line that looks deletable to someone who does not know why it is there
      # -- the empty tool allow list, settingSources, auto-memory, the
      # per-tenant paths. tests/contract.test.ts pins the fail-safe parser, and
      # tests/semaphore.test.ts pins the concurrency bound that stands between
      # a burst and an OOM kill.
      #
      # None of them call a model or need an API key. The whole suite is about
      # a second.
      - name: Control tests (example 03)
        run: npm test

      - name: Build
        run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only. Pushing is left to the repo owner's release workflow so a
      # fork's CI never tries to publish.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: inbox-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A broken relative link in a README is the most common way a teaching
      # repo silently rots. Cheap to check, annoying to find by hand.
      - name: Check relative links
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            grep -oE '\]\(([^)#:]+)\)' "$file" | sed -E 's/^\]\(//; s/\)$//' | while read -r link; do
              case "$link" in
                http*|mailto:*|"") continue ;;
              esac
              target="$dir/${link%%#*}"
              if [ ! -e "$target" ]; then
                echo "BROKEN  $file  ->  $link"
                exit 1
              fi
            done || fail=1
          done < <(find . -name '*.md' -not -path './node_modules/*' -print0)
          exit $fail
