# Minimal OpenTelemetry collector config for local development.
# Receives the agent's traces, metrics, and logs over OTLP/HTTP and prints
# them to stdout, so you can see what the SDK actually emits before you wire
# up a real backend.
#
#   docker compose -f deploy/docker-compose.yml --profile observability up
#   docker compose -f deploy/docker-compose.yml logs -f collector

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
